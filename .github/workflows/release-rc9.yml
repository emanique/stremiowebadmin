# RC9 tests require root for root-owned observation & Nginx credential permission fixtures
# Publish matching RC9 git revision and source package
name: Publish Stremio Standalone RC9
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-rc9.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-stremio-rc9
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version and test selected HLS regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat RELEASE_VERSION)" = "0.1.3-rc.9"
          python -m py_compile scripts/auto-gateway-observer.py scripts/gateway-port-sync.py scripts/reconcile-host.py scripts/configure-host-https.py
          sh -n packaging/stremio-webadmin-setup.sh
          python -m pip install --disable-pip-version-check -q . pytest pytest-asyncio httpx2 httpx
          sudo -E "$(command -v python)" -m pytest -q tests/test_hls_external_registry_stable.py tests/test_playback_sessions.py tests/test_transcode_gc.py tests/test_hls_routes.py tests/test_gateway_auto_onboarding.py tests/test_gateway_observation_contract.py tests/test_host_install_config.py tests/test_webadmin_auth_gate.py tests/test_public_source_defaults.py
      - name: Build source archive and Debian source-build package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-qa-release.sh "$PWD/release-assets"
          (cd release-assets && sha256sum -c SHA256SUMS)
          dpkg-deb --field release-assets/stremio-webadmin_0.1.3~rc9_all.deb Version | grep -Fx '0.1.3~rc9'
          mv release-assets/stremio-webadmin_0.1.3~rc9_all.deb release-assets/stremio-webadmin_0.1.3.rc9_all.deb
          (cd release-assets && sha256sum stremio-webadmin-0.1.3-rc.9-source.tar.gz stremio-webadmin_0.1.3.rc9_all.deb > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish verified pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          if gh release view v0.1.3-rc.9 >/dev/null 2>&1; then
            gh release upload v0.1.3-rc.9 stremio-webadmin-0.1.3-rc.9-source.tar.gz 'stremio-webadmin_0.1.3.rc9_all.deb' SHA256SUMS --clobber
          else
            gh release create v0.1.3-rc.9 stremio-webadmin-0.1.3-rc.9-source.tar.gz 'stremio-webadmin_0.1.3.rc9_all.deb' SHA256SUMS --target "$GITHUB_SHA" --title 'Stremio Standalone v0.1.3-rc.9' --prerelease --notes-file ../docs/releases/v0.1.3-rc.9.md
          fi
          gh release view v0.1.3-rc.9 --json tagName,isPrerelease,assets,url
